[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MultiLabelZ"
version = "0.1.0"
description = "Zebra 4x6 label printer from CSV batches with visual layout editor"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
    { name = "Jake Gustafson", email = "7557867+Poikilos@users.noreply.github.com" },
]
keywords = ["zebra", "zpl", "label", "printer", "barcode", "csv", "tkinter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Hierosoft/multilabelz"
Repository = "https://github.com/Hierosoft/multilabelz"
Issues = "https://github.com/Hierosoft/multilabelz/issues"

[project.scripts]
multilabelz = "multilabelz.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multilabelz*"]

